[buildout]
extends = https://dist.plone.org/release/6.2.2/versions.cfg
show-picked-versions = true
develop = .
parts =
    instance
    omelette

[instance]
recipe = plone.recipe.zope2instance
user = admin:admin
http-address = 8080
eggs =
    Plone
    collective.concepts
    Products.PrintingMailHost
    plone.app.debugtoolbar
    plone.reload

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[versions]
collective.taxonomy = 3.1.7
eea.facetednavigation = 16.4
plone.app.debugtoolbar = 2.0.0
plone.reload = 5.0.1
Products.PrintingMailHost = 2.1.0
z3c.batching = 4.0
z3c.jbot = 3.1
z3c.table = 4.0
zope.dublincore = 6.0
